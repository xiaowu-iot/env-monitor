<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b4f43"/>
      <stop offset="0.55" stop-color="#11735f"/>
      <stop offset="1" stop-color="#2aa384"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffe08a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb79a"/>
      <stop offset="1" stop-color="#2f9077"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8f6f"/>
      <stop offset="1" stop-color="#1f6e55"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17614b"/>
      <stop offset="1" stop-color="#0c3f31"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe3f0"/>
      <stop offset="1" stop-color="#3fb3cf"/>
    </linearGradient>
    <linearGradient id="station" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbf8"/>
      <stop offset="1" stop-color="#cfe7df"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8fff0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b8fff0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b8fff0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="900" cy="230" r="170" fill="url(#sun)"/>
  <circle cx="900" cy="230" r="46" fill="#fff4c4" opacity="0.9"/>

  <!-- 云 -->
  <g fill="#ffffff" opacity="0.16">
    <ellipse cx="260" cy="150" rx="120" ry="22"/>
    <ellipse cx="330" cy="135" rx="70" ry="24"/>
    <ellipse cx="1040" cy="110" rx="110" ry="18"/>
    <ellipse cx="640" cy="200" rx="90" ry="14"/>
  </g>

  <!-- 数据连线：监测站之间的物联网连接 -->
  <g stroke="#c9fff1" stroke-width="1.5" fill="none" opacity="0.55" stroke-dasharray="4 7">
    <path d="M300 360 Q 520 250 760 380"/>
    <path d="M760 380 Q 920 300 1060 420"/>
    <path d="M300 360 Q 200 300 120 400"/>
  </g>
  <g fill="#e9fff8">
    <circle cx="300" cy="360" r="4"/>
    <circle cx="760" cy="380" r="4"/>
    <circle cx="1060" cy="420" r="4"/>
    <circle cx="120" cy="400" r="4"/>
  </g>

  <!-- 远山 -->
  <path d="M0 470 L120 400 L220 440 L340 360 L470 450 L560 410 L690 470 L800 390 L930 455 L1050 380 L1200 450 L1200 760 L0 760 Z" fill="url(#far)" opacity="0.85"/>

  <!-- 风电 -->
  <g stroke="#eafaf4" stroke-linecap="round" fill="none" opacity="0.9">
    <g transform="translate(980 300)">
      <line x1="0" y1="0" x2="0" y2="150" stroke-width="5"/>
      <g stroke-width="4">
        <line x1="0" y1="0" x2="0" y2="-62"/>
        <line x1="0" y1="0" x2="54" y2="31"/>
        <line x1="0" y1="0" x2="-54" y2="31"/>
      </g>
      <circle cx="0" cy="0" r="5" fill="#eafaf4"/>
    </g>
    <g transform="translate(1090 330) scale(0.75)">
      <line x1="0" y1="0" x2="0" y2="160" stroke-width="5"/>
      <g stroke-width="4">
        <line x1="0" y1="0" x2="20" y2="-58"/>
        <line x1="0" y1="0" x2="40" y2="45"/>
        <line x1="0" y1="0" x2="-60" y2="14"/>
      </g>
      <circle cx="0" cy="0" r="5" fill="#eafaf4"/>
    </g>
  </g>

  <!-- 中景山 -->
  <path d="M0 540 C 120 480 220 500 320 460 C 420 420 520 500 640 480 C 760 460 860 520 980 490 C 1080 465 1150 500 1200 490 L1200 760 L0 760 Z" fill="url(#mid)"/>

  <!-- 工厂：烟囱排放已达标（白色淡烟） -->
  <g transform="translate(700 410)">
    <rect x="0" y="40" width="120" height="70" fill="#d9eee7"/>
    <rect x="18" y="58" width="16" height="14" fill="#7fbfae"/>
    <rect x="46" y="58" width="16" height="14" fill="#7fbfae"/>
    <rect x="74" y="58" width="16" height="14" fill="#7fbfae"/>
    <rect x="100" y="-30" width="16" height="140" fill="#eef8f4"/>
    <rect x="100" y="-14" width="16" height="6" fill="#e05a47"/>
    <rect x="100" y="2" width="16" height="6" fill="#e05a47"/>
    <g fill="#ffffff" opacity="0.35">
      <circle cx="112" cy="-44" r="12"/>
      <circle cx="128" cy="-62" r="16"/>
      <circle cx="152" cy="-80" r="20"/>
    </g>
    <!-- 烟气在线监测探头 -->
    <rect x="94" y="20" width="28" height="10" rx="2" fill="#2aa384"/>
    <circle cx="108" cy="25" r="3" fill="#c9fff1"/>
  </g>

  <!-- 河流 -->
  <path d="M520 760 C 560 690 470 650 520 600 C 560 560 680 560 720 530 C 760 500 860 520 900 500 L940 500 C 880 530 800 540 760 570 C 700 615 600 620 610 670 C 620 720 700 740 720 760 Z" fill="url(#river)" opacity="0.95"/>
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="560" y1="700" x2="590" y2="700"/>
    <line x1="640" y1="640" x2="676" y2="640"/>
    <line x1="760" y1="560" x2="790" y2="560"/>
    <line x1="600" y1="730" x2="640" y2="730"/>
  </g>

  <!-- 水质自动监测站 -->
  <g transform="translate(250 470)">
    <rect x="0" y="40" width="110" height="74" rx="4" fill="url(#station)"/>
    <path d="M-8 44 L55 10 L118 44 Z" fill="#e8f5f0"/>
    <rect x="16" y="62" width="30" height="22" rx="2" fill="#9fd7c8"/>
    <rect x="60" y="62" width="34" height="52" rx="2" fill="#7fbfae"/>
    <circle cx="86" cy="90" r="2.5" fill="#f4fbf8"/>
    <!-- 天线和信号 -->
    <line x1="92" y1="10" x2="92" y2="-46" stroke="#f4fbf8" stroke-width="4"/>
    <circle cx="92" cy="-50" r="6" fill="#ffe08a"/>
    <g fill="none" stroke="#c9fff1" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <path d="M108 -64 A 22 22 0 0 1 108 -36"/>
      <path d="M118 -74 A 36 36 0 0 1 118 -26"/>
      <path d="M76 -64 A 22 22 0 0 0 76 -36"/>
      <path d="M66 -74 A 36 36 0 0 0 66 -26"/>
    </g>
    <!-- 取水管 -->
    <path d="M110 100 C 160 100 190 120 260 150" stroke="#f4fbf8" stroke-width="5" fill="none"/>
  </g>

  <!-- 空气质量监测站 -->
  <g transform="translate(95 520)">
    <rect x="0" y="20" width="56" height="60" rx="3" fill="#eaf7f2"/>
    <rect x="8" y="30" width="40" height="8" rx="2" fill="#9fd7c8"/>
    <rect x="8" y="44" width="40" height="8" rx="2" fill="#9fd7c8"/>
    <line x1="28" y1="20" x2="28" y2="-20" stroke="#eaf7f2" stroke-width="3"/>
    <rect x="14" y="-30" width="28" height="12" rx="6" fill="#eaf7f2"/>
  </g>

  <!-- 近景山和树 -->
  <path d="M0 640 C 140 600 260 630 400 610 C 520 595 560 650 500 760 L0 760 Z" fill="url(#near)"/>
  <path d="M760 760 C 800 680 900 640 1020 650 C 1100 655 1160 630 1200 620 L1200 760 Z" fill="url(#near)"/>
  <g fill="#0f5745">
    <path d="M60 640 l18 -60 l18 60 z"/>
    <path d="M100 650 l14 -46 l14 46 z"/>
    <path d="M180 630 l20 -66 l20 66 z"/>
    <path d="M1060 650 l18 -58 l18 58 z"/>
    <path d="M1110 640 l22 -70 l22 70 z"/>
    <path d="M980 668 l14 -44 l14 44 z"/>
  </g>
  <g fill="#2a8c6c">
    <circle cx="380" cy="628" r="18"/>
    <circle cx="410" cy="636" r="14"/>
    <circle cx="880" cy="664" r="16"/>
  </g>

  <!-- 扫描光带 -->
  <rect x="0" y="520" width="1200" height="2" fill="url(#beam)" opacity="0.5"/>
</svg>
